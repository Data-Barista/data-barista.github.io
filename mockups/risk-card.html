<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mockup: Application risk analytics</title>
<link rel="stylesheet" href="mock.css">
<style>
  .stage { padding: 44px 60px; }
  .title { font-family: var(--serif); font-weight: 600; font-size: 40px; letter-spacing: -0.015em; line-height: 1.1; margin: 0 0 6px; }
  .sub { font-size: 16px; color: var(--ink-soft); margin: 0 0 26px; }
  .two { display: grid; grid-template-columns: 300px 1fr; gap: 48px; align-items: start; }
  .kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px 20px 18px; }
  .kpi .l { font-family: var(--mono); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-soft); margin: 0 0 6px; }
  .kpi .v { font-family: var(--serif); font-weight: 600; font-size: 42px; line-height: 1; letter-spacing: -0.02em; color: var(--accent); margin: 0 0 8px; }
  .kpi .s { font-size: 14.5px; color: var(--ink-soft); margin: 0; }
  .link { width: 2px; height: 28px; margin-left: 40px; background: var(--line); }
  .ch h4 { font-family: var(--sans); font-weight: 500; font-size: 21px; margin: 0 0 4px; }
  .ch .cs { font-size: 14px; color: var(--ink-soft); margin: 0 0 6px; }
  svg { display: block; width: 100%; height: auto; }
  .grid { stroke: var(--line); stroke-width: 1; }
  .tick { font-family: var(--sans); font-size: 13px; fill: var(--ink-soft); }
  .ln { fill: none; stroke: var(--accent); stroke-width: 4; stroke-linejoin: round; stroke-linecap: round; }
  .pt { fill: var(--accent); }
  .val { font-family: var(--sans); font-size: 24px; fill: var(--accent); }
  .foot { margin-top: 26px; padding-top: 16px; border-top: 1px solid var(--line); font-size: 24px; color: var(--accent); }

  /* ---- motion (html.play only): the two coverage boxes land, the line
     draws across four weeks with a dot at each week, then the overdue line. ---- */
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } }
  @keyframes fade { from { opacity: 0; } }
  @keyframes growy { from { transform: scaleY(0); } }
  @keyframes draw { from { stroke-dashoffset: 700; } to { stroke-dashoffset: 0; } }
  @keyframes pop { from { opacity: 0; transform: scale(0.4); } 70% { transform: scale(1.2); } }
  html.play .title, html.play .sub, html.play .ch h4, html.play .ch .cs, html.play .grid, html.play .tick { animation: fade 0.5s both; }
  html.play .kpi { animation: rise 0.45s cubic-bezier(0.16, 1, 0.3, 1) both; }
  html.play .kpi:nth-child(1) { animation-delay: 0.4s; }
  html.play .link { transform-origin: top; animation: growy 0.3s 0.8s ease-out both; }
  html.play .kpi:nth-child(3) { animation-delay: 1.0s; }
  html.play .ln { stroke-dasharray: 700; animation: draw 1.6s 1.5s ease-out both; }
  html.play .pt { transform-box: fill-box; transform-origin: center; animation: pop 0.35s cubic-bezier(0.16, 1, 0.3, 1) both; }
  html.play .pt:nth-of-type(1) { animation-delay: 1.5s; }
  html.play .pt:nth-of-type(2) { animation-delay: 1.9s; }
  html.play .pt:nth-of-type(3) { animation-delay: 2.3s; }
  html.play .pt:nth-of-type(4) { animation-delay: 2.7s; }
  html.play .pt:nth-of-type(5) { animation-delay: 3.1s; }
  html.play .val.a { animation: fade 0.4s 1.6s both; }
  html.play .val.b { animation: fade 0.4s 3.2s both; }
  html.play .foot { animation: fade 0.5s 3.6s both; }
</style>
<script src="play.js"></script>
</head>
<body>
<div class="stage">
  <p class="title">From exposure to control</p>
  <p class="sub">Application risk analytics &middot; synthetic example</p>

  <div class="two">
    <div>
      <div class="kpi"><p class="l">Application coverage</p><p class="v">19 / 24</p><p class="s">fully covered</p></div>
      <div class="link"></div>
      <div class="kpi"><p class="l">Repository coverage</p><p class="v">62 / 72</p><p class="s">current scans</p></div>
    </div>

    <div class="ch">
      <h4>Known open findings</h4>
      <p class="cs">Same scope &middot; four weekly intervals</p>
      <svg viewBox="0 0 660 312" aria-hidden="true">
        <line class="grid" x1="20" y1="40" x2="600" y2="40"/>
        <line class="grid" x1="20" y1="160" x2="600" y2="160"/>
        <line class="grid" x1="20" y1="280" x2="600" y2="280"/>
        <text class="tick" x="640" y="45" text-anchor="end">160</text>
        <text class="tick" x="640" y="165" text-anchor="end">80</text>
        <text class="tick" x="640" y="285" text-anchor="end">0</text>
        <text class="tick" x="20" y="304">Opening</text>
        <text class="tick" x="600" y="304" text-anchor="end">Week 4</text>
        <path class="ln" d="M20 34 L165 52 L310 67 L455 85 L600 94"/>
        <circle class="pt" cx="20" cy="34" r="6"/>
        <circle class="pt" cx="165" cy="52" r="6"/>
        <circle class="pt" cx="310" cy="67" r="6"/>
        <circle class="pt" cx="455" cy="85" r="6"/>
        <circle class="pt" cx="600" cy="94" r="6"/>
        <text class="val a" x="26" y="20">164</text>
        <text class="val b" x="594" y="76" text-anchor="end">124</text>
      </svg>
    </div>
  </div>

  <p class="foot">3 critical findings overdue</p>
</div>
</body>
</html>
