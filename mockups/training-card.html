<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mockup: Does training change AI habits?</title>
<link rel="stylesheet" href="mock.css">
<style>
  .stage { padding: 52px 64px; }
  .eyebrow { font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); margin: 0 0 10px; }
  .title { font-family: var(--serif); font-weight: 600; font-size: 44px; letter-spacing: -0.015em; line-height: 1.08; margin: 0 0 6px; }
  .sub { font-size: 17px; color: var(--ink-soft); margin: 0 0 22px; }
  .row { display: grid; grid-template-columns: 1fr 300px; gap: 40px; align-items: center; }
  svg { display: block; width: 100%; }
  .grid { stroke: var(--line); stroke-width: 1; }
  .tick { font-family: var(--sans); font-size: 13px; fill: var(--ink-soft); }
  .band { fill: var(--warn-soft); }
  .bandl { font-family: var(--sans); font-size: 13px; fill: var(--ink-soft); }
  .done { fill: none; stroke: var(--accent); stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
  .enr { fill: none; stroke: var(--ink-soft); stroke-width: 3; stroke-dasharray: 8 7; stroke-linecap: round; }
  .big { text-align: center; }
  .big b { display: block; font-family: var(--serif); font-weight: 600; font-size: 96px; line-height: 1; color: var(--accent); letter-spacing: -0.03em; }
  .big span { display: block; font-size: 18px; line-height: 1.35; color: var(--ink-soft); margin-top: 10px; }
  .legend { display: flex; gap: 36px; margin-top: 18px; font-size: 16px; }
  .legend i { display: inline-block; width: 40px; height: 0; border-top: 4px solid var(--accent); margin-right: 10px; vertical-align: 5px; }
  .legend i.d { border-top: 3px dashed var(--ink-soft); }
  .foot { margin-top: 14px; font-size: 14px; color: var(--ink-soft); }

  /* ---- motion (html.play only): the two lines draw, the training band
     shows where the course sat, the number lands last. ---- */
  @keyframes fade { from { opacity: 0; } }
  @keyframes draw { from { stroke-dashoffset: 1200; } to { stroke-dashoffset: 0; } }
  @keyframes pop { from { opacity: 0; transform: scale(0.85); } 70% { transform: scale(1.03); } }
  html.play .eyebrow, html.play .title, html.play .sub { animation: fade 0.5s both; }
  html.play .band, html.play .bandl { animation: fade 0.5s 0.6s both; }
  html.play .enr { stroke-dasharray: 8 7; animation: fade 0.6s 1.0s both; }
  html.play .done { stroke-dasharray: 1200; stroke-dashoffset: 1200; animation: draw 1.6s 1.2s ease-out both; }
  html.play .big { animation: pop 0.5s 2.9s cubic-bezier(0.16, 1, 0.3, 1) both; }
  html.play .legend, html.play .foot { animation: fade 0.5s 3.4s both; }
</style>
<script src="play.js"></script>
</head>
<body>
<div class="stage">
  <p class="eyebrow">Synthetic data, fictional course</p>
  <p class="title">Does training change AI habits?</p>
  <p class="sub">Everyday AI Studio</p>

  <div class="row">
    <div>
      <svg viewBox="0 0 760 330" aria-hidden="true">
        <rect class="band" x="360" y="20" width="132" height="262"/>
        <text class="bandl" x="426" y="14" text-anchor="middle">Training</text>
        <line class="grid" x1="48" y1="40" x2="740" y2="40"/>
        <line class="grid" x1="48" y1="162" x2="740" y2="162"/>
        <line class="grid" x1="48" y1="282" x2="740" y2="282"/>
        <text class="tick" x="38" y="45" text-anchor="end">24</text>
        <text class="tick" x="38" y="167" text-anchor="end">12</text>
        <text class="tick" x="38" y="287" text-anchor="end">0</text>
        <path class="enr" d="M52 188 L152 178 L252 174 L352 168 L426 158 L500 166 L600 158 L700 154 L740 148"/>
        <path class="done" d="M52 172 L152 162 L252 160 L352 140 L426 122 L500 108 L600 92 L700 88 L740 78"/>
        <text class="tick" x="52" y="318">Before</text>
        <text class="tick" x="740" y="318" text-anchor="end">After</text>
      </svg>
    </div>
    <div class="big">
      <b>+4</b>
      <span>additional<br>actions / week<br>per person</span>
    </div>
  </div>

  <div class="legend"><span><i></i>Completed</span><span><i class="d"></i>Enrolled, not completed</span></div>
  <p class="foot">Illustrative comparison, not a measured outcome.</p>
</div>
</body>
</html>
