<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Data Barista</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#f4f0e8">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <style>
    :root { color-scheme: light; --bg: #f4f0e8; --ink: #30291f; --soft: #6b5b49; --accent: #8c4c24; --line: #cfc3b3; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 1.5rem; background: var(--bg); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; line-height: 1.5; -webkit-font-smoothing: antialiased; }
    main { max-width: 32rem; width: 100%; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 2.5rem 0; }
    .brand { display: inline-flex; align-items: center; gap: .6rem; font-family: "Iowan Old Style", Palatino, "Palatino Linotype", ui-serif, Georgia, serif; font-size: 1.2rem; font-weight: 600; letter-spacing: .01em; margin-bottom: 2rem; }
    .brand svg { color: var(--ink); }
    .mark-steam { fill: var(--accent); }
    h1 { font-size: clamp(1.8rem, 5vw, 2.6rem); line-height: 1.1; letter-spacing: -.02em; margin: 0 0 .75rem; font-weight: 600; }
    p { margin: 0; font-size: 1.125rem; color: var(--soft); }
  </style>
</head>
<body>
  <main>
    <div class="brand">
      <svg viewBox="0 0 64 64" width="22" height="22" aria-hidden="true" focusable="false">
        <rect x="20" y="18" width="5" height="8" rx="2.5" class="mark-steam"/>
        <rect x="29" y="13" width="5" height="13" rx="2.5" class="mark-steam"/>
        <rect x="38" y="8" width="5" height="18" rx="2.5" class="mark-steam"/>
        <path d="M16 32h30v10a10 10 0 0 1-10 10h-10a10 10 0 0 1-10-10z" fill="currentColor"/>
        <path d="M46 36c7 0 7 10 0 10" stroke="currentColor" stroke-width="4" fill="none"/>
      </svg>
      <span>Data Barista</span>
    </div>
    <h1>Down for maintenance.</h1>
    <p>Coming back soon.</p>
  </main>
</body>
</html>
